services:
  postgres_redis:
    container_name: postgres_redis
    image: postgres:latest
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres_redis
    ports:
      - "5432:5432"
  redis_teste:
    image: redis:latest
    container_name: redis_teste
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: on-failure

volumes:
  redis_data:
  postgres_data: